<!-- App shell: sidebar (fixed on lg+, horizontal top bar on small screens, CSS only). -->
<div class="min-h-screen">
  <!-- Sidebar / small-screen top bar -->
  <aside
    class="fixed inset-x-0 top-0 z-30 border-b border-slate-200 bg-white print:hidden lg:inset-y-0 lg:left-0 lg:w-64 lg:border-r lg:border-b-0"
  >
    <div class="flex h-14 items-center justify-between gap-3 px-4 lg:h-auto lg:flex-col lg:items-stretch lg:gap-6 lg:px-4 lg:py-5">
      <a routerLink="" class="flex items-center gap-2.5" aria-label="AssetLite home">
        <span class="grid size-8 shrink-0 place-items-center rounded-lg bg-primary-600 text-sm font-bold text-white">AL</span>
        <span class="text-base font-semibold tracking-tight text-slate-900">AssetLite</span>
      </a>

      <!-- Nav: horizontal scroll on small screens, vertical stack on lg+. -->
      <nav class="flex min-w-0 flex-1 items-center gap-1 overflow-x-auto lg:flex-none lg:flex-col lg:items-stretch lg:overflow-visible" aria-label="Main navigation">
        @for (item of navItems; track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="nav-link-active"
            [routerLinkActiveOptions]="{ exact: item.path === '' }"
            ariaCurrentWhenActive="page"
            class="nav-link"
          >
            <span class="text-base leading-none text-slate-400" aria-hidden="true">{{ item.icon }}</span>
            {{ item.label }}
          </a>
        }
      </nav>
    </div>
  </aside>

  <!-- Content column -->
  <div class="flex min-h-screen flex-col print:pt-0 lg:print:pl-0 pt-14 lg:pl-64">
    <!-- Routed page content. Each page header owns its actions (search, New
         asset, exports) — a global topbar duplicated them on the assets page,
         so the shell stays navigation-only. -->
    <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-6 print:max-w-none print:p-0 sm:px-6 lg:px-8">
      <router-outlet />
    </main>

    <footer class="border-t border-slate-200 px-4 py-4 text-center text-xs text-slate-400 print:hidden sm:px-6 lg:px-8">
      AssetLite · internal asset &amp; inventory console
    </footer>
  </div>
</div>
