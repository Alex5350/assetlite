name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify clean build
        run: dotnet build --configuration Release --warnaserror
      # The test projects use xunit.v3 with Microsoft.Testing.Platform, which runs
      # through `dotnet run` — the `dotnet test` VSTest bridge does not pick them up
      # (it reports zero tests and exits with code 5).
      - name: Run backend tests
        run: |
          dotnet run --project tests/AssetLite.Domain.UnitTests --no-build -c Release
          dotnet run --project tests/AssetLite.Application.UnitTests --no-build -c Release
          dotnet run --project tests/AssetLite.Api.IntegrationTests --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Frontend tests
        run: ng test --watch=false
